<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMF8829 Log Viewer & CSV Exporter 2v2</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pako library for client-side gzip decompression -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .peak-high { color: #065f46; background-color: #d1fae5; border-color: #a7f3d0; }
        .peak-medium { color: #92400e; background-color: #fef3c7; border-color: #fde68a; }
        .peak-low { color: #991b1b; background-color: #fee2e2; border-color: #fca5a5; }
        .peak-none { color: #475569; background-color: #f1f5f9; border-color: #e2e8f0; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans flex flex-col">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900 text-white shadow-md py-3 px-6 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-microchip text-emerald-400 text-2xl"></i>
            <div>
                <h1 class="text-lg font-bold tracking-wide">TMF8829 Log Viewer & Converter 2v2</h1>
                <p class="text-xs text-slate-400">Interactive ToF Sensor Data Analysis & CSV Exporter</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <!-- Upload Buttons -->
            <label class="cursor-pointer bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition-colors flex items-center shadow-sm">
                <i class="fa-solid fa-file-arrow-up mr-2 text-sm"></i>
                <span>Open JSON / JSON.GZ</span>
                <input type="file" id="fileInput" accept=".json,.gz,.json.gz" class="hidden" />
            </label>

            <!-- Export Full CSV Button -->
            <button id="exportFullCsvBtn" disabled onclick="exportCSV(false)" class="disabled:opacity-40 disabled:cursor-not-allowed bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition-colors flex items-center shadow-sm">
                <i class="fa-solid fa-file-csv mr-2 text-sm"></i>
                <span>Export Full CSV</span>
            </button>

            <!-- Export Current Frame CSV Button -->
            <button id="exportFrameCsvBtn" disabled onclick="exportCSV(true)" class="disabled:opacity-40 disabled:cursor-not-allowed bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition-colors flex items-center shadow-sm">
                <i class="fa-solid fa-file-csv mr-2 text-sm"></i>
                <span>Export Current Frame CSV</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 w-full mx-auto p-4 flex flex-col gap-4">

        <!-- File Upload Drag and Drop Zone (Visible when no data loaded) -->
        <div id="dropZone" class="bg-white border-2 border-dashed border-slate-300 rounded-xl p-12 text-center shadow-sm transition-colors hover:border-emerald-500 cursor-pointer">
            <div class="max-w-md mx-auto space-y-4">
                <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-700">Drop your TMF8829 Log File Here</h2>
                <p class="text-xs text-slate-500">Supports <span class="font-semibold text-slate-700">.json</span> and compressed <span class="font-semibold text-slate-700">.json.gz</span> files directly in browser.</p>
                <div class="pt-2">
                    <button onclick="document.getElementById('fileInput').click()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold px-5 py-2.5 rounded-lg shadow">
                        Browse File
                    </button>
                </div>
            </div>
        </div>

        <!-- App Main Visualizer Workspace (Hidden until data is loaded) -->
        <div id="visualizerApp" class="hidden flex-col gap-4">

            <!-- System Info Bar -->
            <div id="versionInfo" class="bg-amber-50 border border-amber-200 text-amber-900 rounded-lg py-2 px-4 text-xs flex flex-wrap items-center justify-between gap-2 shadow-sm font-medium">
                <!-- Version details populated dynamically -->
            </div>

            <!-- Top Control Bar -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 space-y-3">
                <div id="frameDetails" class="bg-blue-50 border border-blue-100 rounded-lg p-2 text-xs text-blue-900 font-mono leading-relaxed flex flex-wrap items-center justify-between gap-x-4 gap-y-1">
                    <!-- Dynamic frame details -->
                </div>

                <!-- Synchronized Controls Block 1 -->
                <div id="controlsGroup1"></div>
            </div>

            <!-- Central Data Visualizer Grid -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
                <div class="grid-container overflow-auto max-h-[70vh] border border-slate-300 rounded-lg p-2 bg-slate-50 custom-scrollbar">
                    <div id="dataGrid" class="grid gap-1.5 min-w-[600px]"></div>
                </div>
            </div>

            <!-- Histogram Display Container -->
            <div id="histoContainer" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-4">
                <div class="text-xs font-bold text-slate-700 mb-3 flex items-center justify-between">
                    <span class="flex items-center gap-2">
                        <i class="fa-solid fa-chart-column text-emerald-600"></i>
                        <span>Histogram Data Grid</span>
                    </span>
                    <span class="text-slate-400 font-normal">Click any cell chart to enlarge</span>
                </div>
                <div id="histoGrid" class="grid gap-2 max-h-[600px] overflow-auto p-1 custom-scrollbar"></div>
            </div>

            <!-- Bottom Control Bar -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3">
                <!-- Synchronized Controls Block 2 -->
                <div id="controlsGroup2"></div>
            </div>
        </div>

    </main>

    <!-- Modal for Enlarged Histogram -->
    <div id="histoModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-4xl w-full max-h-[95vh] overflow-hidden flex flex-col relative border border-slate-200">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 bg-slate-50">
                <h3 id="modalTitle" class="text-base font-bold text-slate-800"></h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-xl font-bold p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto custom-scrollbar flex-1 space-y-4">
                <div class="flex flex-wrap items-center gap-4 text-xs text-slate-600 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
                    <label class="flex items-center gap-2">
                        <span class="font-bold text-slate-700">Y-axis</span>
                        <select id="modalYAxisType" onchange="updateModalScale()" class="border border-slate-300 rounded px-2 py-1 bg-white">
                            <option value="linear" selected>Linear</option>
                            <option value="log">Logarithmic</option>
                        </select>
                    </label>
                    <label class="flex items-center gap-2">
                        <input id="modalYAutoScale" type="checkbox" checked onchange="updateModalScale()" class="accent-emerald-600">
                        <span>Auto scale</span>
                    </label>
                    <label class="flex items-center gap-2">
                        <span>Max count</span>
                        <input id="modalYMax" type="number" min="1" step="1" disabled oninput="updateModalScale()"
                               class="w-28 border border-slate-300 rounded px-2 py-1 bg-white disabled:bg-slate-100 disabled:text-slate-400">
                    </label>
                </div>
                <div id="modalChart" class="relative w-full flex flex-col items-center"></div>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Global State
        let rawData = null;
        let result_set = [];
        let config = {};
        let deviceInfo = {};
        let currentFrame = 0;
        let numPeaksToShow = 4;
        let hasHistogram = false;
        let isPlaying = false;
        let playInterval = null;

        let displayOptions = {
            showNoise: false,
            showPeaks: true,
            showXtalk: false,
            showDistance: true,
            showSNR: true,
            showXYZ: false,
            showSignal: false,
            showHistogram: false,
            histoType: 'mp'
        };

        // DOM Elements
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const visualizerApp = document.getElementById('visualizerApp');
        const exportFullCsvBtn = document.getElementById('exportFullCsvBtn');
        const exportFrameCsvBtn = document.getElementById('exportFrameCsvBtn');

        // File Drag & Drop Event Listeners
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-emerald-500', 'bg-emerald-50/50');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-emerald-500', 'bg-emerald-50/50');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-emerald-500', 'bg-emerald-50/50');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // File Parsing Logic
        function handleFile(file) {
            const reader = new FileReader();
            const fileName = file.name;

            if (fileName.endsWith('.gz') || fileName.endsWith('.json.gz')) {
                reader.onload = function(e) {
                    try {
                        const compressed = new Uint8Array(e.target.result);
                        const decompressed = pako.inflate(compressed, { to: 'string' });
                        const parsedData = JSON.parse(decompressed);
                        loadDataset(parsedData, fileName);
                    } catch (err) {
                        alert('Error decompressing or parsing .json.gz file: ' + err.message);
                    }
                };
                reader.readAsArrayBuffer(file);
            } else if (fileName.endsWith('.json')) {
                reader.onload = function(e) {
                    try {
                        const parsedData = JSON.parse(e.target.result);
                        loadDataset(parsedData, fileName);
                    } catch (err) {
                        alert('Error parsing JSON file: ' + err.message);
                    }
                };
                reader.readAsText(file);
            } else {
                alert('Unsupported file type. Please upload a .json or .json.gz file.');
            }
        }

        // Initialize App State with Dataset
        function loadDataset(data, fileName) {
            rawData = data;
            result_set = data.Result_Set || [];
            config = data.configuration || {};
            
            const infoList = data.info || [];
            deviceInfo = Array.isArray(infoList) && infoList.length > 0 ? infoList[0] : (typeof infoList === 'object' ? infoList : {});

            currentFrame = 0;
            numPeaksToShow = config.nr_peaks || 4;

            if (result_set.length === 0) {
                alert('No Result_Set found in log file.');
                return;
            }

            // Reveal UI and Enable Actions
            dropZone.classList.add('hidden');
            visualizerApp.classList.remove('hidden');
            visualizerApp.classList.add('flex');
            exportFullCsvBtn.disabled = false;
            exportFrameCsvBtn.disabled = false;

            renderControlRows();
            initVersionInfo(fileName);
            initNumPeaksSelect();
            checkHistogramAvailability();
            updatePeaksOptionsEnabled();
            updateDisplay();
        }

        // Generate Dual Control Rows (Top & Bottom)
        function renderControlRows() {
            const template = (suffix) => `
                <div class="flex flex-wrap items-center justify-between gap-3 text-xs">
                    <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
                        <label class="inline-flex items-center gap-1.5 cursor-pointer font-medium text-slate-700">
                            <input type="checkbox" id="showNoise${suffix}" class="rounded text-emerald-600 focus:ring-emerald-500">
                            <span>Noise</span>
                        </label>
                        <label class="inline-flex items-center gap-1.5 cursor-pointer font-medium text-slate-700">
                            <input type="checkbox" id="showXtalk${suffix}" class="rounded text-emerald-600 focus:ring-emerald-500">
                            <span>XTalk</span>
                        </label>

                        <div class="flex items-center gap-2 border-l border-r border-slate-200 px-3 py-0.5">
                            <label class="inline-flex items-center gap-1.5 cursor-pointer font-semibold text-slate-800">
                                <input type="checkbox" id="showPeaks${suffix}" checked class="rounded text-emerald-600 focus:ring-emerald-500">
                                <span>Peaks</span>
                            </label>
                            <select id="numPeaksSelect${suffix}" class="border border-slate-300 rounded px-1.5 py-0.5 text-xs bg-white focus:outline-none focus:border-emerald-500"></select>

                            <label class="inline-flex items-center gap-1 cursor-pointer text-slate-600">
                                <input type="checkbox" id="showDistance${suffix}" checked class="rounded text-emerald-600 focus:ring-emerald-500">
                                <span>Distance</span>
                            </label>
                            <label class="inline-flex items-center gap-1 cursor-pointer text-slate-600">
                                <input type="checkbox" id="showSNR${suffix}" checked class="rounded text-emerald-600 focus:ring-emerald-500">
                                <span>SNR</span>
                            </label>
                            <label class="inline-flex items-center gap-1 cursor-pointer text-slate-600">
                                <input type="checkbox" id="showSignal${suffix}" class="rounded text-emerald-600 focus:ring-emerald-500">
                                <span>Signal</span>
                            </label>
                            <label class="inline-flex items-center gap-1 cursor-pointer text-slate-600">
                                <input type="checkbox" id="showXYZ${suffix}" class="rounded text-emerald-600 focus:ring-emerald-500">
                                <span>XYZ</span>
                            </label>
                        </div>

                        <div class="flex items-center gap-2">
                            <label class="inline-flex items-center gap-1.5 cursor-pointer font-medium text-slate-700">
                                <input type="checkbox" id="showHistogram${suffix}" disabled class="rounded text-emerald-600 focus:ring-emerald-500 disabled:opacity-50">
                                <span>Histogram</span>
                            </label>
                            <select id="histoTypeSelect${suffix}" disabled class="border border-slate-300 rounded px-1.5 py-0.5 text-xs bg-white focus:outline-none focus:border-emerald-500 disabled:opacity-50">
                                <option value="mp">MP</option>
                                <option value="ref">Ref</option>
                                <option value="mp_ha">MP_HA</option>
                                <option value="ref_ha">Ref_HA</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 flex-1 max-w-md justify-end">
                        <input type="range" id="frameSlider${suffix}" min="0" max="${result_set.length - 1}" value="0" step="1" class="w-full accent-emerald-600">
                        <span id="frameInfo${suffix}" class="font-mono text-xs text-slate-600 whitespace-nowrap min-w-[65px] text-right">0 / ${result_set.length - 1}</span>
                        <div class="flex items-center gap-1">
                            <button onclick="prevFrame()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-2.5 py-1 rounded font-semibold text-xs transition">◀</button>
                            <button onclick="togglePlay()" id="playBtn${suffix}" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded font-semibold text-xs transition"><i class="fa-solid fa-play"></i></button>
                            <button onclick="nextFrame()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-2.5 py-1 rounded font-semibold text-xs transition">▶</button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('controlsGroup1').innerHTML = template('1');
            document.getElementById('controlsGroup2').innerHTML = template('2');

            bindControlEvents('1', '2');
            bindControlEvents('2', '1');
        }

        // Bind and Synchronize Top and Bottom Controls
        function bindControlEvents(primary, secondary) {
            document.getElementById(`frameSlider${primary}`).addEventListener('input', (e) => {
                currentFrame = parseInt(e.target.value);
                updateDisplay();
            });

            ['showNoise', 'showXtalk', 'showDistance', 'showSNR', 'showXYZ', 'showSignal'].forEach(key => {
                document.getElementById(`${key}${primary}`).addEventListener('change', (e) => {
                    displayOptions[key] = e.target.checked;
                    syncCheckboxes(key, primary, secondary);
                    updateDisplay();
                });
            });

            document.getElementById(`showPeaks${primary}`).addEventListener('change', (e) => {
                displayOptions.showPeaks = e.target.checked;
                syncCheckboxes('showPeaks', primary, secondary);
                updatePeaksOptionsEnabled();
                updateDisplay();
            });

            document.getElementById(`numPeaksSelect${primary}`).addEventListener('change', (e) => {
                numPeaksToShow = parseInt(e.target.value);
                document.getElementById(`numPeaksSelect${secondary}`).value = e.target.value;
                updateDisplay();
            });

            document.getElementById(`showHistogram${primary}`).addEventListener('change', (e) => {
                displayOptions.showHistogram = e.target.checked;
                syncCheckboxes('showHistogram', primary, secondary);
                updateDisplay();
            });

            document.getElementById(`histoTypeSelect${primary}`).addEventListener('change', (e) => {
                displayOptions.histoType = e.target.value;
                document.getElementById(`histoTypeSelect${secondary}`).value = e.target.value;
                updateHistogramDisplay();
            });
        }

        function syncCheckboxes(key, srcSuffix, destSuffix) {
            const val = document.getElementById(`${key}${srcSuffix}`).checked;
            document.getElementById(`${key}${destSuffix}`).checked = val;
        }

        // Detect Histogram Availability
        function checkHistogramAvailability(frame = null) {
            if (frame === null) frame = result_set[0];
            hasHistogram = false;

            if (frame) {
                const checkHistoKey = (key) => {
                    if (frame[key] && frame[key].length > 0) {
                        for (let item of frame[key]) {
                            const target = Array.isArray(item) ? item[0] : item;
                            if (target && target.bin && Array.isArray(target.bin) && target.bin.length > 0) {
                                return true;
                            }
                        }
                    }
                    return false;
                };

                hasHistogram = checkHistoKey('mp_histo') || checkHistoKey('ref_histo') || checkHistoKey('mp_histo_HA') || checkHistoKey('ref_histo_HA');
            }

            ['1', '2'].forEach(suffix => {
                document.getElementById(`showHistogram${suffix}`).disabled = !hasHistogram;
                document.getElementById(`histoTypeSelect${suffix}`).disabled = !hasHistogram;
            });
        }

        // Metadata Header
        function initVersionInfo(fileName) {
            const versionDiv = document.getElementById('versionInfo');
            const formatVer = (val) => (!val || (typeof val === 'string' && val.trim() === '')) ? 'N/A' : (Array.isArray(val) ? val.join('.') : val);

            const hostVersion = formatVer(deviceInfo['host version'] || deviceInfo['EVM version'] || deviceInfo['host_version']);
            const fwVersion = formatVer(deviceInfo['fw version'] || deviceInfo['fw_version']);
            const loggerVersion = formatVer(deviceInfo['logger version'] || deviceInfo['logger_version']);
            const serialNumber = formatVer(deviceInfo['serial number'] || deviceInfo['serial_number']);

            versionDiv.innerHTML = `
                <div class="flex items-center gap-2">
                    <span class="font-bold text-slate-700"><i class="fa-solid fa-file-code text-slate-500 mr-1"></i>${fileName}</span>
                </div>
                <div class="flex flex-wrap items-center gap-x-4 gap-y-1">
                    <span>Host: <strong class="text-slate-800">${hostVersion}</strong></span>
                    <span>FW: <strong class="text-slate-800">${fwVersion}</strong></span>
                    <span>Logger: <strong class="text-slate-800">${loggerVersion}</strong></span>
                    <span>Serial: <strong class="text-slate-800">${serialNumber}</strong></span>
                </div>
            `;
        }

        function initNumPeaksSelect() {
            const maxObjects = 4;
            const defaultPeaks = config.nr_peaks || 4;

            ['1', '2'].forEach(suffix => {
                const select = document.getElementById(`numPeaksSelect${suffix}`);
                if (!select) return;
                select.innerHTML = '';
                for (let i = 1; i <= maxObjects; i++) {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = i;
                    if (i === defaultPeaks) opt.selected = true;
                    select.appendChild(opt);
                }
            });
            numPeaksToShow = parseInt(document.getElementById('numPeaksSelect1').value);
        }

        function updatePeaksOptionsEnabled() {
            const showPeaks = displayOptions.showPeaks;
            ['showDistance', 'showSNR', 'showXYZ', 'showSignal', 'numPeaksSelect'].forEach(optKey => {
                ['1', '2'].forEach(suffix => {
                    const el = document.getElementById(`${optKey}${suffix}`);
                    if (el) el.disabled = !showPeaks;
                });
            });
        }

        // Render Main Grid & Metadata
        function updateDisplay() {
            const frame = result_set[currentFrame];
            const grid = document.getElementById('dataGrid');

            checkHistogramAvailability(frame);

            ['1', '2'].forEach(suffix => {
                document.getElementById(`frameSlider${suffix}`).value = currentFrame;
                document.getElementById(`frameInfo${suffix}`).textContent = `${currentFrame} / ${result_set.length - 1}`;
            });

            let resolution = 'N/A';
            if (frame.results && frame.results.length > 0) {
                const rows = frame.results.length;
                const cols = frame.results[0] ? frame.results[0].length : 0;
                resolution = `${cols}x${rows}`;
            }

            const frameDetails = document.getElementById('frameDetails');
            if (frame.info) {
                const iterations = config.iterations || 'N/A';
                const period = config.period || 'N/A';
                const confThresh = config.confidence_threshold || 'N/A';
                const readTime = frame.info.read_time || frame.info.systick_t0 || 'N/A';
                const haIterations = config.high_accuracy_iterations || 'N/A';
                const hasWarnings = frame.info.warnings > 0;

                frameDetails.innerHTML = `
                    <div class="flex items-center gap-3">
                        ${hasWarnings ? '<span class="text-rose-600 font-bold"><i class="fa-solid fa-triangle-exclamation"></i> Warnings</span>' : ''}
                        <span>Frame: <strong class="text-blue-900">${frame.info.frame_number || currentFrame}</strong></span>
                        <span>Res: <strong>${resolution}</strong></span>
                        <span>Iter: <strong>${iterations}k</strong></span>
                        <span>HA_Iter: <strong>${haIterations}k</strong></span>
                        <span>Period: <strong>${period}ms</strong></span>
                        <span>Conf Thresh: <strong>${confThresh}</strong></span>
                        <span>Temp: <strong>${frame.info.temperature}°C</strong></span>
                        <span>ReadTime: <strong>${readTime}</strong></span>
                    </div>
                    <div class="flex items-center gap-2 text-[10px] uppercase tracking-wider font-sans font-bold">
                        <span class="px-1.5 py-0.5 rounded peak-high">c &gt; 20</span>
                        <span class="px-1.5 py-0.5 rounded peak-medium">20 ≥ c &gt; 10</span>
                        <span class="px-1.5 py-0.5 rounded peak-low">10 ≥ c &gt; 0</span>
                    </div>
                `;
            } else {
                frameDetails.textContent = `Resolution: ${resolution} | Frame info not available`;
            }

            grid.innerHTML = '';
            if (!frame.results) {
                grid.innerHTML = '<div class="p-8 text-center text-slate-400 italic">No results data available for this frame</div>';
                return;
            }

            const rows = frame.results.length;
            const cols = frame.results[0] ? frame.results[0].length : 0;
            grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'bg-white border border-slate-300 rounded p-1.5 flex flex-col justify-between relative min-h-[64px] shadow-sm hover:border-slate-400 transition';

                    const header = document.createElement('div');
                    header.className = 'text-[9px] font-mono text-slate-400 text-right';
                    header.textContent = `(${col},${row})`;
                    cell.appendChild(header);

                    const dataDiv = document.createElement('div');
                    dataDiv.className = 'text-[10px] font-mono leading-tight space-y-1 mt-1';

                    if (frame.results[row] && frame.results[row][col]) {
                        const cellData = frame.results[row][col];
                        let hasData = false;

                        if (displayOptions.showNoise && 'noise' in cellData) {
                            const noiseDiv = document.createElement('div');
                            noiseDiv.className = 'bg-slate-100 text-slate-600 px-1 py-0.5 rounded text-[9px]';
                            noiseDiv.textContent = `Noise: ${cellData.noise}`;
                            dataDiv.appendChild(noiseDiv);
                            hasData = true;
                        }

                        if (displayOptions.showPeaks && cellData.peaks && cellData.peaks.length > 0) {
                            cellData.peaks.slice(0, numPeaksToShow).forEach((peak, peakIndex) => {
                                const peakDiv = document.createElement('div');
                                const snr = peak.snr;

                                let peakClass = 'peak-none';
                                if (snr > 20) peakClass = 'peak-high';
                                else if (snr > 10) peakClass = 'peak-medium';
                                else if (snr > 0) peakClass = 'peak-low';

                                peakDiv.className = `border rounded px-1 py-0.5 ${peakClass}`;
                                const peakNum = peakIndex + 1;
                                let peakLines = [];

                                if (displayOptions.showDistance) {
                                    peakLines.push(`d${peakNum}:${peak.distance}`);
                                }
                                if (displayOptions.showSNR) {
                                    peakLines.push(`c${peakNum}:${snr}`);
                                }
                                if (displayOptions.showSignal) {
                                    peakLines.push(`s${peakNum}:${peak.signal}`);
                                }
                                if (displayOptions.showXYZ) {
                                    const xText = parseFloat(peak.x).toFixed(1);
                                    const yText = parseFloat(peak.y).toFixed(1);
                                    const zText = parseFloat(peak.z).toFixed(1);
                                    peakLines.push(`x${peakNum}:${xText}`);
                                    peakLines.push(`y${peakNum}:${yText}`);
                                    peakLines.push(`z${peakNum}:${zText}`);
                                }

                                peakDiv.innerHTML = peakLines.map(line => `<div class="whitespace-pre text-left">${line}</div>`).join('');
                                dataDiv.appendChild(peakDiv);
                                hasData = true;
                            });
                        }

                        if (displayOptions.showXtalk && 'xtalk' in cellData) {
                            const xtalkDiv = document.createElement('div');
                            xtalkDiv.className = 'bg-purple-50 text-purple-700 border border-purple-200 px-1 py-0.5 rounded text-[9px]';
                            xtalkDiv.textContent = `XTalk: ${cellData.xtalk}`;
                            dataDiv.appendChild(xtalkDiv);
                            hasData = true;
                        }

                        if (!hasData) {
                            dataDiv.innerHTML = '<div class="text-slate-300 italic text-[9px]">No data</div>';
                        }
                    } else {
                        dataDiv.innerHTML = '<div class="text-slate-300 italic text-[9px]">No data</div>';
                    }

                    cell.appendChild(dataDiv);
                    grid.appendChild(cell);
                }
            }

            updateHistogramDisplay();
        }

        // SVG Histogram Chart Generator
        function createHistogramChart(bins, width, height, color = '#10b981', showTicks = false, options = {}) {
            if (!bins || bins.length === 0) {
                return `<div style="width:${width}px;height:${height}px;" class="flex items-center justify-center text-slate-300 text-[9px]">No data</div>`;
            }

            const { logScale = false, yMax = null } = options;
            const dataMax = Math.max(...bins);
            const maxValue = Math.max(1, (yMax !== null && Number.isFinite(yMax) && yMax > 0) ? yMax : dataMax);
            const logMax = Math.log10(1 + maxValue);
            const fractionOf = (value) => {
                const clamped = Math.max(0, Math.min(maxValue, value));
                return logScale ? Math.log10(1 + clamped) / logMax : clamped / maxValue;
            };
            const padding = showTicks ? 45 : 10;
            const chartWidth = width - padding * 2;
            const chartHeight = height - padding * 2;
            const barWidth = chartWidth / bins.length;
            const barGap = Math.max(0.5, barWidth * 0.1);
            const actualBarWidth = Math.max(1, barWidth - barGap);

            let svg = `<svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg" class="overflow-visible">`;
            svg += `<line x1="${padding}" y1="${padding}" x2="${padding}" y2="${height - padding}" stroke="#cbd5e1" stroke-width="1"/>`;
            svg += `<line x1="${padding}" y1="${height - padding}" x2="${width - padding}" y2="${height - padding}" stroke="#cbd5e1" stroke-width="1"/>`;

            bins.forEach((value, index) => {
                const barHeight = fractionOf(value) * chartHeight;
                const x = padding + index * barWidth;
                const y = height - padding - barHeight;
                if (barHeight > 0) {
                    svg += `<rect x="${x}" y="${y}" width="${actualBarWidth}" height="${barHeight}" fill="${color}" opacity="0.85"/>`;
                }
            });

            if (showTicks) {
                const xTickCount = Math.min(10, bins.length);
                const xTickStep = Math.ceil(bins.length / xTickCount);
                for (let i = 0; i <= bins.length; i += xTickStep) {
                    const x = padding + i * barWidth;
                    svg += `<line x1="${x}" y1="${height - padding}" x2="${x}" y2="${height - padding + 4}" stroke="#64748b" stroke-width="1"/>`;
                    svg += `<text x="${x}" y="${height - padding + 16}" text-anchor="middle" font-size="10" fill="#64748b" font-family="sans-serif">${i}</text>`;
                }

                const yTickCount = 5;
                for (let i = 0; i <= yTickCount; i++) {
                    const fraction = i / yTickCount;
                    const value = Math.round(logScale ? (10 ** (fraction * logMax)) - 1 : maxValue * fraction);
                    const y = height - padding - fraction * chartHeight;
                    svg += `<line x1="${padding - 4}" y1="${y}" x2="${padding}" y2="${y}" stroke="#64748b" stroke-width="1"/>`;
                    svg += `<text x="${padding - 6}" y="${y + 3}" text-anchor="end" font-size="10" fill="#64748b" font-family="sans-serif">${value}</text>`;
                }
            }

            svg += `</svg>`;
            return svg;
        }

        // Render Histogram Grid
        function updateHistogramDisplay() {
            const frame = result_set[currentFrame];
            const histoContainer = document.getElementById('histoContainer');
            const histoGrid = document.getElementById('histoGrid');

            if (!displayOptions.showHistogram || !hasHistogram) {
                histoContainer.classList.add('hidden');
                return;
            }

            histoContainer.classList.remove('hidden');
            histoGrid.innerHTML = '';

            let rows = frame.results ? frame.results.length : 0;
            let cols = frame.results && frame.results[0] ? frame.results[0].length : 0;

            const histoType = displayOptions.histoType;
            const isRefType = (histoType === 'ref' || histoType === 'ref_ha');
            const displayCols = isRefType ? 1 : cols;

            histoGrid.style.gridTemplateColumns = `repeat(${displayCols}, minmax(0, 1fr))`;

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < displayCols; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'bg-slate-50 border border-slate-200 hover:border-emerald-500 rounded p-2 flex flex-col items-center justify-center cursor-pointer transition shadow-sm hover:shadow';

                    const header = document.createElement('div');
                    header.className = 'text-[9px] font-mono text-slate-400 self-end mb-1';
                    header.textContent = `(${col},${row})`;
                    cell.appendChild(header);

                    let binData = [];
                    let color = '#10b981';

                    if (histoType === 'mp' && frame.mp_histo && frame.mp_histo[row] && frame.mp_histo[row][col]) {
                        binData = frame.mp_histo[row][col].bin || [];
                        color = '#10b981';
                    } else if (histoType === 'ref' && frame.ref_histo && frame.ref_histo[row]) {
                        binData = frame.ref_histo[row].bin || [];
                        color = '#3b82f6';
                    } else if (histoType === 'mp_ha' && frame.mp_histo_HA && frame.mp_histo_HA[row] && frame.mp_histo_HA[row][col]) {
                        binData = frame.mp_histo_HA[row][col].bin || [];
                        color = '#f97316';
                    } else if (histoType === 'ref_ha' && frame.ref_histo_HA && frame.ref_histo_HA[row]) {
                        binData = frame.ref_histo_HA[row].bin || [];
                        color = '#a855f7';
                    }

                    const chartDiv = document.createElement('div');
                    chartDiv.innerHTML = createHistogramChart(binData, 120, 60, color);
                    cell.appendChild(chartDiv);

                    if (binData.length > 0) {
                        cell.onclick = () => openModal(histoType.toUpperCase(), row, col, binData, color);
                    }

                    histoGrid.appendChild(cell);
                }
            }
        }

        // Modal for Enlarge Histogram View
        let modalState = { type: '', row: 0, col: 0, bins: [], color: '#10b981', logScale: false, autoScale: true, yMax: null };

        function openModal(type, row, col, bins, color) {
            const modal = document.getElementById('histoModal');
            const modalTitle = document.getElementById('modalTitle');

            modalState = { type, row, col, bins: bins || [], color, logScale: false, autoScale: true, yMax: null };
            document.getElementById('modalYAxisType').value = 'linear';
            document.getElementById('modalYAutoScale').checked = true;
            const maxInput = document.getElementById('modalYMax');
            maxInput.disabled = true;
            maxInput.value = modalState.bins.length ? Math.max(...modalState.bins) : 1;

            modalTitle.textContent = `${type} Histogram - Position (${col}, ${row})`;
            renderModalChart();

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function updateModalScale() {
            const maxInput = document.getElementById('modalYMax');
            modalState.logScale = document.getElementById('modalYAxisType').value === 'log';
            modalState.autoScale = document.getElementById('modalYAutoScale').checked;
            maxInput.disabled = modalState.autoScale;

            if (modalState.autoScale) {
                modalState.yMax = null;
                maxInput.value = modalState.bins.length ? Math.max(...modalState.bins) : 1;
            } else {
                const value = Number(maxInput.value);
                modalState.yMax = Number.isFinite(value) && value > 0 ? value : null;
            }
            renderModalChart();
        }

        function renderModalChart() {
            const modalChart = document.getElementById('modalChart');
            const { row, col, bins, color, logScale, yMax } = modalState;
            const frame = result_set[currentFrame];

            modalChart.innerHTML = createHistogramChart(bins, 700, 450, color, true, { logScale, yMax });

            if (bins && bins.length > 0) {
                let maxCount = 0;
                let maxBinIndex = 0;
                bins.forEach((v, i) => {
                    if (v > maxCount) {
                        maxCount = v;
                        maxBinIndex = i;
                    }
                });

                const annotation = document.createElement('div');
                annotation.className = 'mt-4 inline-flex items-center gap-2 bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm';
                annotation.innerHTML = `<i class="fa-solid fa-chart-line text-emerald-600"></i> Peak Bin: ${maxBinIndex} | Max Count: ${maxCount}`;
                modalChart.appendChild(annotation);
            }

            if (frame && frame.results && frame.results[row] && frame.results[row][col]) {
                const cellData = frame.results[row][col];
                if (cellData.peaks && cellData.peaks.length > 0) {
                    const peakInfo = document.createElement('div');
                    peakInfo.className = 'mt-3 w-full max-w-lg bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs space-y-1.5';
                    peakInfo.innerHTML = '<div class="font-bold text-slate-700 border-b border-slate-200 pb-1">Cell Peak Metrics</div>';

                    cellData.peaks.forEach((p, idx) => {
                        const snr = p.snr;
                        const colorClass = snr > 20 ? 'text-emerald-700 font-semibold' : (snr > 10 ? 'text-amber-700' : 'text-rose-700');
                        peakInfo.innerHTML += `
                            <div class="flex justify-between font-mono ${colorClass}">
                                <span>Peak ${idx + 1}: Distance = ${p.distance} mm</span>
                                <span>SNR = ${snr}</span>
                            </div>
                        `;
                    });
                    modalChart.appendChild(peakInfo);
                }
            }
        }

        function closeModal() {
            const modal = document.getElementById('histoModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        window.onclick = function(e) {
            const modal = document.getElementById('histoModal');
            if (e.target === modal) closeModal();
        };

        // Frame Navigation & Auto-Play
        function prevFrame() {
            if (currentFrame > 0) {
                currentFrame--;
                updateDisplay();
            }
        }

        function nextFrame() {
            if (currentFrame < result_set.length - 1) {
                currentFrame++;
                updateDisplay();
            } else if (isPlaying) {
                togglePlay();
            }
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            ['1', '2'].forEach(suffix => {
                const btn = document.getElementById(`playBtn${suffix}`);
                if (btn) btn.innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
            });

            if (isPlaying) {
                playInterval = setInterval(() => {
                    nextFrame();
                }, 150);
            } else {
                clearInterval(playInterval);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (visualizerApp.classList.contains('hidden')) return;
            if (e.key === 'ArrowLeft') prevFrame();
            if (e.key === 'ArrowRight') nextFrame();
            if (e.key === 'Space') { e.preventDefault(); togglePlay(); }
            if (e.key === 'Home') { currentFrame = 0; updateDisplay(); }
            if (e.key === 'End') { currentFrame = result_set.length - 1; updateDisplay(); }
        });

        // CSV Export Logic (Parity with json_to_csv.py)
        function exportCSV(singleFrameOnly = false) {
            if (!rawData) return;

            let csvRows = [];
            csvRows.push("sep=,");

            // Helper to dump sections like #CONFIG
            if (rawData.configuration) {
                let keysRow = ["#CONFIG"];
                let valsRow = ["#CONFIG"];
                for (let [k, v] of Object.entries(rawData.configuration)) {
                    keysRow.push(k);
                    if (Array.isArray(v)) {
                        // Format array entries like Python lists: ['0x21', '0x00', '0x08'] and wrap in quotes for CSV column safety
                        const items = v.map(x => `'${String(x).replace(/^'|'$/g, '')}'`).join(', ');
                        valsRow.push(`"[${items}]"`);
                    } else if (typeof v === 'string' && (v.includes(',') || v.includes('"'))) {
                        valsRow.push(`"${v.replace(/"/g, '""')}"`);
                    } else {
                        valsRow.push(v);
                    }
                }
                csvRows.push(keysRow.join(","));
                csvRows.push(valsRow.join(","));
            }

            let histogramCounter = 0;
            const targetFrames = singleFrameOnly ? [result_set[currentFrame]] : result_set;

            targetFrames.forEach(frame => {
                // 1. Export results (#PIXEL)
                if (frame.results && frame.results.length > 0 && frame.results[0].length > 0) {
                    histogramCounter = 0;
                    let pixel = 0;
                    let headerKey = ["#PIXEL"];

                    const sampleCell = frame.results[0][0];
                    if ('noise' in sampleCell) headerKey.push("noise");
                    if ('xtalk' in sampleCell) headerKey.push("xtalk");
                    if ('peaks' in sampleCell && Array.isArray(sampleCell.peaks)) {
                        sampleCell.peaks.forEach((peak, i) => {
                            if ('distance' in peak) headerKey.push(`distance${i}`);
                            if ('snr' in peak) headerKey.push(`snr${i}`);
                            if ('signal' in peak) headerKey.push(`signal${i}`);
                            if ('x' in peak) headerKey.push(`x${i}`);
                            if ('y' in peak) headerKey.push(`y${i}`);
                            if ('z' in peak) headerKey.push(`z${i}`);
                        });
                    }
                    csvRows.push(headerKey.join(","));

                    frame.results.forEach(row => {
                        row.forEach(cell => {
                            let pixelStr = String(pixel).padStart(4, '0');
                            let rowVal = [`#PIXEL${pixelStr}`];

                            if ('noise' in cell) rowVal.push(cell.noise);
                            if ('xtalk' in cell) rowVal.push(cell.xtalk);
                            if ('peaks' in cell && Array.isArray(cell.peaks)) {
                                cell.peaks.forEach(peak => {
                                    if ('distance' in peak) rowVal.push(peak.distance);
                                    if ('snr' in peak) rowVal.push(peak.snr);
                                    if ('signal' in peak) rowVal.push(peak.signal);
                                    if ('x' in peak) rowVal.push(peak.x);
                                    if ('y' in peak) rowVal.push(peak.y);
                                    if ('z' in peak) rowVal.push(peak.z);
                                });
                            }
                            csvRows.push(rowVal.join(","));
                            pixel++;
                        });
                    });
                }

                // 2. Export mp_histo raw bins (#RAWBIN)
                if (frame.mp_histo && Array.isArray(frame.mp_histo)) {
                    let headerKey = ["#RAWBIN"];
                    for (let i = 0; i < 64; i++) {
                        headerKey.push(i);
                    }
                    csvRows.push(headerKey.join(","));

                    frame.mp_histo.forEach(mp_data => {
                        if (Array.isArray(mp_data)) {
                            mp_data.forEach(histogram => {
                                let rawStr = String(histogramCounter).padStart(3, '0');
                                let rowVal = [`#RAW${rawStr}`];
                                histogramCounter++;

                                if (histogram.bin && Array.isArray(histogram.bin)) {
                                    histogram.bin.forEach(v => rowVal.push(v));
                                }
                                csvRows.push(rowVal.join(","));
                            });
                        }
                    });
                }
            });

            // Trigger file download
            const csvString = csvRows.join("\n");
            const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            const suffix = singleFrameOnly ? `_frame_${currentFrame}.csv` : '.csv';
            a.href = url;
            a.download = `tmf8829_export${suffix}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
